apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "ir.ac.kntu"
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def appCenterSdkVersion = '3.0.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0' //had -beta01
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'me.grantland:autofittextview:0.2.1'
    implementation 'com.roughike:bottom-bar:2.3.1'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.karumi:dexter:5.0.0'
    implementation 'com.mindorks.android:placeholderview:1.0.3'
    implementation 'de.hdodenhof:circleimageview:3.0.0'
    implementation 'com.joooonho:selectableroundedimageview:1.0.1'
    implementation 'com.github.ar-android:AndroidSvgLoader:1.0.2'
    annotationProcessor 'com.mindorks.android:placeholderview-compiler:1.0.3'
    implementation 'com.jaeger.statusbarutil:library:1.5.1'
    implementation 'jp.wasabeef:recyclerview-animators:3.0.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.dlazaro66.qrcodereaderview:qrcodereaderview:2.0.3'
    implementation "com.andkulikov:transitionseverywhere:1.8.1"
    implementation 'android.arch.persistence.room:runtime:1.1.1'
    annotationProcessor 'android.arch.persistence.room:compiler:1.1.1'
    implementation 'com.zarinpal:purchase:0.0.8-beta'
    implementation 'com.pushpole.android:pushsdk:1.7.0'
//{ exclude group: 'com.mcxiaoke.volley', module: 'library' }
    implementation 'com.github.captain-miao:optroundcardview:1.0.0'
    implementation 'com.github.samanzamani.persiandate:PersianDate:0.7'
    implementation 'me.dm7.barcodescanner:zxing:1.9.13'
    implementation 'androidmads.library.qrgenearator:QRGenearator:1.0.3'
    implementation 'com.github.vihtarb:tooltip:0.2.0'
    implementation 'com.alirezaafkar:sundatepicker:2.1.2'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
    implementation 'com.github.GrenderG:Toasty:1.4.2'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation 'com.jaredrummler:animated-svg-view:1.0.6'
    implementation 'com.lijiankun24:shadowlayout:1.1.0'
    implementation 'ir.map:map-sdk:4.0.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-services:3.4.1'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-geojson:4.9.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-android-telemetry:4.5.1'
    implementation 'com.mapbox.mapboxsdk:mapbox-android-gestures:0.5.1'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'ir.map.sdk:sdk_services:3.0.7'
    implementation 'ir.map.sdk:sdk_common:3.0.1'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.felipecsl.asymmetricgridview:library:2.0.1'
    implementation 'com.daasuu:CountAnimationTextView:0.1.2'
    implementation 'com.github.nikartm:image-support:1.0.5'
    implementation 'com.jaeger.statusbarutil:library:1.5.1'
}
repositories {
    mavenCentral()
}